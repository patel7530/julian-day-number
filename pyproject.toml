[project]
name = "julian-day-number"
version = "0.1.3"
description = "Translates Gregorian calendar dates into the continuous day-count system employed by astronomers and historians."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
